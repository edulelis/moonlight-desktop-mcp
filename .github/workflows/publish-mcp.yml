name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: mcp-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish server metadata
    if: github.repository == 'edulelis/moonlight-desktop-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag." >&2
            exit 1
          fi

      - name: Verify JavaScript and MCP contract
        run: |
          npm run check
          npm test
          npm pack --dry-run
          npm audit --audit-level=critical

      - name: Install official MCP publisher
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Validate Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish server.json
