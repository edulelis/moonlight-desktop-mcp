name: Verify Moonlight Desktop MCP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-contract:
    name: JavaScript and MCP contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  native-linux:
    name: Native bridge (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config build-essential libssl-dev libavcodec-dev libavutil-dev libswscale-dev
      - run: npm ci
      - run: npm run setup:native
      - run: npm run build:native
      - run: npm run doctor -- --strict
      - name: Bootstrap install and update (Linux)
        env:
          MOONLIGHT_MCP_REPOSITORY: ${{ github.workspace }}
          MOONLIGHT_MCP_INSTALL_DIR: ${{ runner.temp }}/moonlight-desktop-mcp-install
          MOONLIGHT_MCP_CONFIGURE_CODEX: "0"
        run: |
          bash ./install.sh
          bash ./install.sh
