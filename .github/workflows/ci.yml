name: Verify Moonlight Desktop MCP

on:
  pull_request:
  push:
    branches: [main]

jobs:
  javascript-contract:
    name: JavaScript and MCP contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

  native-linux:
    name: Native bridge (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config build-essential libssl-dev libavcodec-dev libavutil-dev libswscale-dev
      - run: npm ci
      - run: npm run setup:native
      - run: npm run build:native
      - run: npm run doctor -- --strict
